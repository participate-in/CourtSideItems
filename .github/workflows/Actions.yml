name: Deploy to GitHub Pages via gh-pages branch

on:
  push:
    branches: [ master ] # master  へのプッシュで起動

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. コードの取得
      - name: Checkout
        uses: actions/checkout@v4

      # 2. .NET 8 のセットアップ
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Blazor アプリのビルド（.csproj を明示的に指定）
      - name: Publish Blazor WebAssembly
        run: dotnet publish CourtSideItems/CourtSideItems.csproj -c Release -o release

      # 4. 404エラー対策（.nojekyll と 404.html の自動生成）
      - name: Add .nojekyll & 404.html
        run: |
          echo "" > release/wwwroot/.nojekyll
          cp release/wwwroot/index.html release/wwwroot/404.html

      # 5. wwwroot の中身だけを gh-pages ブランチにデプロイ
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          FOLDER: release/wwwroot
          BRANCH: gh-pages